<script type="application/json" id="post-data">[{"slug":"a-tree-of-words","title":"把日子，写成一棵树","date":"2026-10-12","category":"随笔","summary":"有些念头不必急着开花。把它们写下来，交给时间，慢慢长成自己的枝叶。","body":[["p","以前总觉得，记录应该等到有什么值得讲述的事情发生。后来才发现，许多值得留下的东西，恰恰藏在那些平常的日子里。"],["p","比如窗边慢慢变凉的一杯茶，散步时听见的鸟鸣，或是在读到某句话时，忽然停住的一瞬间。这些细小的片段，看起来互不相干，却在时间里悄悄连成了一条线。"],["h2","让文字有自己的生长方式"],["p","我想象过一个这样的地方：打开它，先看见树冠。不同的枝叶通向不同的话题，顺着树干向下走，就能遇见过去写下的自己。"],["quote","写作不是把每一天变得特别，而是让那些原本就特别的时刻，有一个可以停留的地方。"],["p","新的文章长在上方，旧的文章留在更深的年轮里。它们不必争夺注意力，也不必排列得整整齐齐。每一段文字都可以保有自己的节奏。"],["h2","给阅读留一点空白"],["p","页面不需要一直提醒你还有多少没有看。读完一篇，停一会儿；喜欢的话，再顺着另一条枝杈走走。偶尔什么也不点，只看看树，也很好。"],["p","这棵树会长得很慢。但只要还愿意观察、思考和记录，它就会一直长下去。"]]},{"slug":"afternoon-path","title":"山路转弯的地方","date":"2026-09-28","category":"行记","summary":"沿着一条不熟悉的小路走到傍晚，才发现，最好的风景常常没有名字。","body":[["p","出门的时候，没有想好要走到哪里。山脚下的小路还有一点潮湿，石阶缝里长着细细的草。"],["p","走过第一个转弯，城市的声音忽然远了。能听见风从树叶之间穿过去，像有人把一页纸轻轻翻开。"],["h2","不急着抵达"],["p","一路上停了好几次。有时看苔藓，有时看云，有时只是找块干净的石头坐一会儿。没有目的地，时间反而变得宽裕。"],["quote","路的意义，也许不全在于它通往哪里。"],["p","回头时，天色刚好变成淡淡的蓝灰色。我没有拍很多照片，却记得那天风的温度。"]]},{"slug":"small-web","title":"一个轻一点的网站","date":"2026-09-06","category":"造物","summary":"少一些等待，少一些装饰的负担。让打开网页这件事，像翻开一本书一样自然。","body":[["p","一个网页可以装下很多东西，但读者打开它，往往只是想看一段文字。"],["h2","从等待开始"],["p","图片的尺寸、字体的加载、脚本的数量，都会变成读者真实的等待时间。把页面做轻，首先是尊重这段时间。"],["p","装饰可以使用矢量图形，文字可以先出现。大图片按显示尺寸提供，屏幕之外的图片稍后再加载。看起来微小的选择，会累积成流畅的阅读。"],["quote","好的设计，是让内容顺利到达读者面前。"],["h2","保留必要的东西"],["p","清楚的标题、舒适的行距、能找到的导航，以及随时可以返回的位置。简单的页面也可以有鲜明的性格。"]]},{"slug":"reading-in-rain","title":"雨天读书，晴天散步","date":"2026-08-19","category":"随笔","summary":"生活不一定需要一张严格的时间表，也可以跟着天气，给自己安排一点小事。","body":[["p","下雨的时候，房间安静了许多。窗外的声音变得均匀，正好适合读那些一直放在桌边的书。"],["p","晴天就出去走走。沿着熟悉的街道，看看哪家店换了招牌，哪棵树开始落叶。"],["h2","平常也值得记录"],["p","这样的日子没有特别鲜明的故事，却有稳定而柔和的纹理。写下来，回头再读，能想起当时的光线。"]]},{"slug":"window-light","title":"留住窗边的一束光","date":"2026-06-03","category":"造物","summary":"做一件小东西，不为解决多大的问题，只因为想把那个瞬间留下来。","body":[["p","下午四点，阳光会从书架的空隙穿过，在桌上停留十几分钟。我想为这束光做一个小小的记录。"],["h2","从观察到动手"],["p","先画几条线，再选一种纸。反复试过之后，才慢慢接近脑海里的样子。"],["quote","亲手做过的东西，会记得你花在它身上的时间。"],["p","最后得到的物件很简单。放在窗边，刚好能接住一小片明亮。"]]},{"slug":"winter-letter","title":"写给冬天的一封信","date":"2025-12-21","category":"随笔","summary":"这一年也有许多没有完成的事情。但回头看，走过的路已经足够长了。","body":[["p","冬至这天，天黑得很早。收拾桌面时翻到了年初写的几页计划，有些完成了，有些已经不再重要。"],["p","比起勾掉多少事项，我更愿意记住这一年里，那些让我觉得踏实的瞬间。"],["h2","允许事情慢一点"],["p","并不是每个问题都需要在年底得到答案。有些想法适合先放着，等春天来了，再看看它有没有发芽。"]]},{"slug":"by-the-river","title":"在河边，听水流过去","date":"2025-10-08","category":"行记","summary":"午后沿河走了很久。水没有回答任何问题，却让心里安静了一些。","body":[["p","河岸边的树已经开始发黄。几片叶子落在水面上，慢慢漂过桥洞。"],["p","我沿着河边走，没有戴耳机。水声、脚步声和远处的谈话声，合在一起，刚好填满这个下午。"],["quote","有时候，走出去本身就是答案。"],["p","回去的路上买了一袋栗子。暖意从纸袋里透出来，秋天就变得具体了。"]]},{"slug":"first-leaf","title":"第一片叶子","date":"2025-04-16","category":"随笔","summary":"在这里种下一点文字。从今天起，给想法一个慢慢生长的地方。","body":[["p","这是这个小小园地的第一篇记录。没有特别宏大的计划，只想留下读过的书、走过的路和偶尔冒出来的念头。"],["p","希望很久以后再打开这里，仍然能认出今天的自己。"],["quote","先种下，再等风来。"]]}]</script>
<script>(function prototypeApp(){
"use strict";

const crown=document.getElementById("crown-template").innerHTML;

const dialog=document.getElementById("search-dialog");
const cats=["全部","随笔","行记","造物"];
const escape=(v)=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hrefHome=(category="全部",q="")=>"#/"+((category!=="全部"||q)?"?"+new URLSearchParams({category,q}).toString():"");
const route=()=>{const raw=location.hash.slice(1)||"/";const [path,query=""]=raw.split("?");return {path,params:new URLSearchParams(query)};};
const roots=`<svg class="roots" viewBox="0 0 170 70" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M85 0Q84 27 45 42L12 50M86 3Q91 34 127 43L155 53" stroke-width="3"/><path d="M85 6Q82 43 70 62M87 14Q101 45 110 63M46 42L40 57M122 42L139 37" stroke-width="1.3"/></g></svg>`;
function currentHomeState(){return {hash:location.hash||"#/",scroll:window.scrollY,limit:history.state?.limit||6};}
function saveScroll(){history.replaceState({...history.state,scroll:window.scrollY},"");}
function navigate(hash,extra={}){
  saveScroll();
  history.pushState({scroll:0,...extra},"",hash);
  render(true);
}
function articleCard(p){
return `<article class="entry" id="entry-${p.slug}">${twig}<div class="meta"><time datetime="${p.date}">${p.date.replaceAll("-"," · ")}</time><span class="dot" aria-hidden="true"></span><span>${escape(p.category)}</span></div><h2><a href="#/post/${p.slug}">${escape(p.title)}</a></h2><p>${escape(p.summary)}</p><a class="read" href="#/post/${p.slug}" aria-label="阅读：${escape(p.title)}">沿此枝阅读 <span aria-hidden="true">↗</span></a></article>`;
}
function home(params){
 const category=cats.includes(params.get("category"))?params.get("category"):"全部";
 const q=(params.get("q")||"").slice(0,100).trim();
 const filtered=posts.filter(p=>(category==="全部"||p.category===category)&&(!q||(p.title+" "+p.summary+" "+p.category).toLocaleLowerCase().includes(q.toLocaleLowerCase())));
 const limit=history.state?.limit||6;let year="";let cards="";
 for(const p of filtered.slice(0,limit)){if(year!==p.date.slice(0,4)){year=p.date.slice(0,4);cards+=`<div class="year">${year}</div>`;}cards+=articleCard(p);}
 document.title="云砚 · 字里生长";
 main.innerHTML=`<section class="crown" aria-label="树冠导航">${crown}<nav class="crown-pages" aria-label="页面导航"><a href="#/about">关于</a><a href="#/archive">归档</a><a href="#/search">寻文</a></nav><div class="inscription"><p class="eyebrow">A GARDEN OF WORDS</p><h1 tabindex="-1">字里生长</h1><p class="subtitle">以文字为叶，以时间为枝。<br>在这里，慢慢长成自己。</p></div><span class="margin-note" aria-hidden="true">一方纸上 · 四季常青</span><div role="group" aria-label="文章分类">${cats.map((c,i)=>`<button class="category cat-${i}" data-category="${c}" aria-pressed="${c===category}">${c}<small>${c==="全部"?posts.length:posts.filter(p=>p.category===c).length}</small></button>`).join("")}</div><span class="scroll-note" aria-hidden="true">循着年轮，向下阅读 ↓</span></section>
<section class="journal" id="journal" aria-label="文章时间线"><svg class="trunk-bend" viewBox="0 0 390 72" preserveAspectRatio="none" aria-hidden="true"><path d="M190 0C185 25 35 27 22 72H32C38 35 201 37 200 0Z" fill="#56634d" opacity=".82"/><path d="M194 0C189 30 36 32 27 72" fill="none" stroke="#acb49b" stroke-width="1"/></svg><svg class="trunk" viewBox="0 0 38 1000" preserveAspectRatio="none" aria-hidden="true"><path d="M10 0C21 130 5 260 14 390S6 650 17 790L12 1000H27C21 850 31 720 25 580S31 250 25 0Z" fill="#56634d" opacity=".82"/><path d="M19 0C30 170 10 340 22 510S16 820 22 1000" fill="none" stroke="#acb49b" stroke-width="1.5"/><path d="M13 50C22 240 10 340 17 440M24 700L21 960" fill="none" stroke="#f6f3eb" opacity=".5"/></svg><div class="journal-top"><div><span class="filter-label">${q?"寻文 · "+escape(q):category==="全部"?"最近的枝叶":escape(category)+" · 枝叶"}</span>${category!=="全部"||q?'<button class="reset" id="reset-filter">查看全部</button>':""}</div><span id="result-count" role="status">${filtered.length} 篇文字 · 从新到旧</span></div><div id="entries">${cards||'<div class="empty"><p>这条枝上，还没有找到文字。</p><button class="reset" id="empty-reset">回到全部文章</button></div>'}</div><div class="end">${filtered.length>limit?'<button class="load-more" id="load-more">再往年轮深处走走 ↓</button>':'<span class="end-note">已至初芽，故事仍在生长。</span>'}</div></section>${roots}`;
 main.querySelectorAll("[data-category]").forEach(button=>button.addEventListener("click",()=>navigate(hrefHome(button.dataset.category,q))));
 for(const id of ["reset-filter","empty-reset"])document.getElementById(id)?.addEventListener("click",()=>navigate("#/"));
 document.getElementById("load-more")?.addEventListener("click",()=>{
  const scroll=window.scrollY;

 });
}
function backLink(){return `<a class="back" data-return href="${escape(history.state?.origin?.hash||"#/")}">← 回到树下</a>`;}
function reading(p){
 document.title=p.title+" · 云砚";
 main.innerHTML=`<section class="reading">${backLink()}<article><p class="eyebrow">${p.date.replaceAll("-"," · ")} &nbsp; / &nbsp; ${escape(p.category)} &nbsp; / &nbsp; 示例文章</p><h1 tabindex="-1">${escape(p.title)}</h1><p class="lead">${escape(p.summary)}</p><div class="prose">${p.body.map(([type,text])=>type==="quote"?`<blockquote><p>${escape(text)}</p></blockquote>`:`<${type}>${escape(text)}</${type}>`).join("")}</div><div class="article-end">${backLink()}<span>读到这里，歇一歇也好。</span></div></article></section>`;
}
function archive(){
 document.title="归档 · 云砚";let year="";
 main.innerHTML=`<section class="reading">${backLink()}<p class="eyebrow">THE RINGS OF TIME</p><h1 tabindex="-1">岁月有痕</h1><p class="lead">每一篇文字，都是时间留下的一圈年轮。</p>${posts.map(p=>{let heading="";if(year!==p.date.slice(0,4)){year=p.date.slice(0,4);heading=`<h2 class="archive-year">${year}</h2>`;}return heading+`<a class="archive-link" href="#/post/${p.slug}"><span>${escape(p.title)}</span><time datetime="${p.date}">${p.date.slice(5).replace("-"," / ")}</time></a>`;}).join("")}</section>`;
}
function about(){
 document.title="关于 · 云砚";
 main.innerHTML=`<section class="reading">${backLink()}<p class="eyebrow">A SMALL PLACE TO GROW</p><h1 tabindex="-1">在文字里，栽一棵树</h1><p class="lead">一处慢慢记录、慢慢生长的个人园地。</p><div class="prose"><p>这里收藏生活中的片刻、路途上的风景，以及亲手做东西时冒出的想法。</p><p>你可以从树冠挑选感兴趣的枝叶，也可以顺着树干，读到更早以前的故事。希望你找到一段值得停留的文字。</p><blockquote><p>愿每一次到访，都像在树下坐了一会儿。</p></blockquote><h2>关于这个示例</h2><p>这是 CloudInk「云砚」的树形阅读原型。文章、分类和站点题字均为演示内容，用于体验新的博客外观。</p></div></section>`;
}
function render(focus=false){
 const {path,params}=route();
 if(path==="/")home(params);
 else if(path==="/about")about();
 else if(path==="/archive")archive();
 else if(path.startsWith("/post/")){const p=posts.find(p=>p.slug===path.slice(6));if(p)reading(p);else main.innerHTML=`<section class="reading">${backLink()}<h1 tabindex="-1">这片叶子暂未找到</h1><p class="lead">回到树下，看看其他文字吧。</p></section>`;}
 else if(path==="/search"){home(params);openSearch();}
 else{main.innerHTML=`<section class="reading">${backLink()}<h1 tabindex="-1">这条小径暂未开放</h1></section>`;}
 const y=history.state?.scroll||0;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{

 }));
}
function openSearch(){
 document.getElementById("search-input").value=route().params.get("q")||"";
 if(!dialog.open)dialog.showModal();
 document.getElementById("search-input").focus();
}
document.addEventListener("click",event=>{
 const anchor=event.target.closest("a");
 if(!anchor||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||anchor.target==="_blank")return;
 const hash=anchor.getAttribute("href");
 if(!hash?.startsWith("#/"))return;
 event.preventDefault();
 if(hash==="#/search"){openSearch();return;}
 if(anchor.hasAttribute("data-return")&&history.state?.origin){
  const origin=history.state.origin;
  navigate(origin.hash,{scroll:origin.scroll,limit:origin.limit});
  return;
 }
 const origin=route().path==="/"?currentHomeState():history.state?.origin;
 navigate(hash,origin?{origin}:{});
});
document.getElementById("open-search").addEventListener("click",openSearch);
document.getElementById("close-search").addEventListener("click",()=>dialog.close());
dialog.addEventListener("click",event=>{if(event.target===dialog){const b=dialog.getBoundingClientRect();if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)dialog.close();}});
document.getElementById("search-form").addEventListener("submit",event=>{
 event.preventDefault();const q=document.getElementById("search-input").value.trim();
 dialog.close();navigate(hrefHome("全部",q));
 requestAnimationFrame(()=>document.getElementById("journal").scrollIntoView({block:"start"}));
});
history.scrollRestoration="manual";
if(!history.state)history.replaceState({scroll:0,limit:6},"");
window.addEventListener("popstate",()=>{if(dialog.open)dialog.close();render(true);});
window.addEventListener("hashchange",()=>render(true));
window.addEventListener("pagehide",saveScroll);
render();
})();</script>
</body>
</html>
