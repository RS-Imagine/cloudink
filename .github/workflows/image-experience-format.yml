name: Image experience formatting
on:
  push:
    branches: [feat/progressive-image-preview, feat/existing-image-optimization]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write cloud-web/test/reader.browser.mjs crates/blog-core/src/assets/reader.css
      - run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const path of ['cloud-web/test/reader.browser.mjs', 'crates/blog-core/src/assets/reader.css'])
            console.log('IMAGE_FORMAT_FILE ' + path + ' ' + (await readFile(path)).toString('base64'));
          NODE
