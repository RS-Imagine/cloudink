name: Image experience formatting
on:
  push:
    branches: [feat/existing-image-optimization]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write .github/workflows/checks.yml README.md docs/DEVELOPMENT.md cloud-admin/build-ui.mjs cloud-admin/src/image-variants.ts cloud-admin/src/index.ts cloud-admin/src/image-library.ts cloud-admin/src/storage-mutations.ts cloud-admin/ui/app.js cloud-admin/ui/images.js cloud-admin/ui/index.html cloud-admin/ui/image-maintenance.js cloud-web/src/index.ts cloud-web/test/image-optimization.test.mjs cloud-web/test/image-maintenance.browser.mjs cloud-web/test/images.browser.mjs cloud-web/test/image-photo-fixture.mjs cloud-web/test/image-quality.browser.mjs scripts/ui-audit.mjs
      - run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const path of [".github/workflows/checks.yml","README.md","docs/DEVELOPMENT.md","cloud-admin/build-ui.mjs","cloud-admin/src/image-variants.ts","cloud-admin/src/index.ts","cloud-admin/src/image-library.ts","cloud-admin/src/storage-mutations.ts","cloud-admin/ui/app.js","cloud-admin/ui/images.js","cloud-admin/ui/index.html","cloud-admin/ui/image-maintenance.js","cloud-web/src/index.ts","cloud-web/test/image-optimization.test.mjs","cloud-web/test/image-maintenance.browser.mjs","cloud-web/test/images.browser.mjs","cloud-web/test/image-photo-fixture.mjs","cloud-web/test/image-quality.browser.mjs","scripts/ui-audit.mjs"])
            console.log('IMAGE_FORMAT_FILE ' + path + ' ' + (await readFile(path)).toString('base64'));
          NODE
