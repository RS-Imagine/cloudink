name: Format backup recovery change
on:
  push:
    branches: [fix/backup-draft-recovery]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: |
          npx prettier --write cloud-admin/src/backup.ts cloud-web/test/backup.test.mjs docs/DEVELOPMENT.md
          node --check cloud-web/test/backup.test.mjs
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for (const path of ['cloud-admin/src/backup.ts','cloud-web/test/backup.test.mjs','docs/DEVELOPMENT.md'])
            console.log('BACKUP_FORMAT ' + JSON.stringify({path,content:(await readFile(path)).toString('base64')}));
          JS
