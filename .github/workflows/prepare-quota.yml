name: Prepare quota optimization source formatting
on:
  push:
    branches: [perf/storage-and-request-efficiency]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format changed source only
        run: npx --yes prettier@3.9.9 --write 'cloud-web/src/cache.ts' 'cloud-web/src/index.ts' 'cloud-admin/src/media.ts' 'cloud-web/src/reader.ts' 'cloud-admin/src/models.ts' 'cloud-admin/src/browser-publishing.ts' 'cloud-admin/src/publishing.ts' 'cloud-admin/src/index.ts' 'cloud-admin/src/storage-mutations.ts' 'cloud-admin/ui/publication.js' 'cloud-admin/src/maintenance.ts' 'wrangler.jsonc' 'cloud-admin/ui/image-upload.js' 'cloud-admin/ui/image.worker.js' 'cloud-admin/ui/app.js' 'cloud-admin/ui/index.html' 'cloud-admin/ui/images.js' 'cloud-admin/src/image-library.ts' 'cloud-admin/src/backup.ts' 'scripts/web-assets.mjs' '.github/workflows/checks.yml' 'cloud-web/test/quota-efficiency.test.mjs' 'cloud-web/test/image-optimizer.browser.mjs' 'docs/DEPLOYMENT.md' 'README.md' 'docs/DEVELOPMENT.md' 'cloud-admin/build-ui.mjs' 'cloud-web/test/image-performance.browser.mjs' 'cloud-web/test/reader.test.mjs'
      - name: Export formatted source
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          for (const path of ["cloud-web/src/cache.ts","cloud-web/src/index.ts","cloud-admin/src/media.ts","cloud-web/src/reader.ts","cloud-admin/src/models.ts","cloud-admin/src/browser-publishing.ts","cloud-admin/src/publishing.ts","cloud-admin/src/index.ts","cloud-admin/src/storage-mutations.ts","cloud-admin/ui/publication.js","cloud-admin/src/maintenance.ts","wrangler.jsonc","cloud-admin/ui/image-upload.js","cloud-admin/ui/image.worker.js","cloud-admin/ui/app.js","cloud-admin/ui/index.html","cloud-admin/ui/images.js","cloud-admin/src/image-library.ts","cloud-admin/src/backup.ts","scripts/web-assets.mjs",".github/workflows/checks.yml","cloud-web/test/quota-efficiency.test.mjs","cloud-web/test/image-optimizer.browser.mjs","docs/DEPLOYMENT.md","README.md","docs/DEVELOPMENT.md","cloud-admin/build-ui.mjs","cloud-web/test/image-performance.browser.mjs","cloud-web/test/reader.test.mjs"]) {
            const data = readFileSync(path).toString('base64');
            for (let at = 0; at < data.length; at += 6000)
              console.log('OPT_FORMAT ' + JSON.stringify({path,part:at/6000,data:data.slice(at,at+6000)}));
          }
          JS
