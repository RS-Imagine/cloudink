name: Image change formatting
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format changed sources
        run: |
          npx prettier --write cloud-admin/build-ui.mjs cloud-admin/src/backup.ts cloud-admin/src/browser-publishing.ts cloud-admin/src/image-library.ts cloud-admin/src/index.ts cloud-admin/ui/app.js cloud-admin/ui/images.js cloud-web/src/index.ts cloud-web/test/images.browser.mjs cloud-admin/src/image-info.ts cloud-admin/src/image-variants.ts cloud-admin/ui/image-upload.js cloud-admin/ui/image.worker.js cloud-web/test/image-optimization.test.mjs cloud-web/test/image-optimizer.browser.mjs cloud-web/test/image-performance.browser.mjs scripts/ui-audit.mjs .github/workflows/checks.yml README.md docs/DEVELOPMENT.md docs/DEPLOYMENT.md
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          for (const path of ["cloud-admin/build-ui.mjs","cloud-admin/src/backup.ts","cloud-admin/src/browser-publishing.ts","cloud-admin/src/image-library.ts","cloud-admin/src/index.ts","cloud-admin/ui/app.js","cloud-admin/ui/images.js","cloud-web/src/index.ts","cloud-web/test/images.browser.mjs","cloud-admin/src/image-info.ts","cloud-admin/src/image-variants.ts","cloud-admin/ui/image-upload.js","cloud-admin/ui/image.worker.js","cloud-web/test/image-optimization.test.mjs","cloud-web/test/image-optimizer.browser.mjs","cloud-web/test/image-performance.browser.mjs","scripts/ui-audit.mjs",".github/workflows/checks.yml","README.md","docs/DEVELOPMENT.md","docs/DEPLOYMENT.md"]) console.log('IMAGE_FORMAT_FILE ' + path + ' ' + (await readFile(path)).toString('base64'));
          JS
