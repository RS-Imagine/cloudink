name: Format gallery fixes
on:
  push:
    branches: [fix/gallery-loading-and-layout]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format only the changed files
        run: |
          npx prettier --write cloud-admin/ui/app.js cloud-admin/ui/images.js cloud-admin/ui/workflows.css crates/blog-core/src/assets/reader.css cloud-web/test/reader.browser.mjs scripts/ui-audit.mjs cloud-admin/build-ui.mjs cloud-web/src/index.ts cloud-admin/ui/image-library-loader.js cloud-admin/ui/images.css cloud-web/test/ui-stability.browser.mjs docs/DEVELOPMENT.md
          rustup component add rustfmt
          rustfmt --edition 2021 crates/blog-core/tests/home.rs
      - name: Return formatted source
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for (const path of ["cloud-admin/ui/app.js","cloud-admin/ui/images.js","cloud-admin/ui/workflows.css","crates/blog-core/src/assets/reader.css","crates/blog-core/tests/home.rs","cloud-web/test/reader.browser.mjs","scripts/ui-audit.mjs","cloud-admin/build-ui.mjs","cloud-web/src/index.ts",".gitignore","cloud-admin/ui/image-library-loader.js","cloud-admin/ui/images.css","cloud-web/test/ui-stability.browser.mjs","docs/DEVELOPMENT.md"]) {
            const value=(await readFile(path)).toString('base64');
            for(let part=0;part*12000<value.length;part++)
              console.log('CLOUDINK_FORMAT ' + JSON.stringify({path,part,data:value.slice(part*12000,(part+1)*12000)}));
          }
          JS
