name: Import source formatting
on: pull_request
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: rustfmt --edition 2021 crates/blog-core/src/import.rs crates/blog-core/tests/import.rs crates/blog-wasm/src/lib.rs
      - name: Emit canonical source
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import prettier from 'prettier';
          const normal = ["cloud-admin/ui/preview.worker.js","cloud-admin/ui/markdown-import.js","cloud-admin/ui/app.js","cloud-admin/ui/index.html","cloud-admin/ui/workflows.css","cloud-web/test/import.browser.mjs","cloud-web/test/editor.browser.mjs","scripts/ui-audit.mjs","README.md","docs/DEVELOPMENT.md"];
          const rust = ["crates/blog-core/src/import.rs","crates/blog-core/tests/import.rs","crates/blog-wasm/src/lib.rs"];
          for (const path of [...normal, ...rust]) {
            const before = execFileSync('git', ['show', 'HEAD:' + path], { encoding: 'utf8' });
            const source = await readFile(path, 'utf8');
            const after = rust.includes(path) ? source : await prettier.format(source, { ...(await prettier.resolveConfig(path)), filepath: path });
            if (before !== after) console.log('CLOUDINK_FORMAT_FILE', path, Buffer.from(after).toString('base64'));
          }
          NODE
