name: Prepare editorial review sources
on:
  pull_request:
jobs:
  prepare:
    if: github.head_ref == 'feat/editorial-concept-fidelity'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format touched design sources
        run: |
          npx prettier --write cloud-admin/ui/index.html cloud-admin/ui/home-illustration.js cloud-web/test/home-illustration.browser.mjs cloud-admin/build-ui.mjs cloud-web/src/index.ts cloud-web/test/deployment.browser.mjs cloud-web/test/reader-loading.browser.mjs cloud-web/test/editorial-admin.browser.mjs docs/design/EDITORIAL-FIDELITY.md scripts/ui-audit.mjs crates/blog-core/src/assets/home.css cloud-web/test/reader-performance.browser.mjs cloud-web/test/reader.test.mjs cloud-web/test/image-optimization.test.mjs
          rustup component add rustfmt
          cargo fmt --all
      - name: Export formatted sources for review
        env:
          SOURCE_PATHS: '["crates/blog-core/src/render.rs","cloud-admin/ui/index.html","cloud-admin/ui/home-illustration.js","cloud-web/test/home-illustration.browser.mjs","cloud-admin/build-ui.mjs","cloud-web/src/index.ts","cloud-web/test/deployment.browser.mjs","cloud-web/test/reader-loading.browser.mjs","cloud-web/test/editorial-admin.browser.mjs","crates/blog-core/src/lib.rs","crates/blog-core/tests/home.rs","docs/design/EDITORIAL-FIDELITY.md","scripts/ui-audit.mjs","crates/blog-core/src/assets/home.css","cloud-web/test/reader-performance.browser.mjs","cloud-web/test/reader.test.mjs","cloud-web/test/image-optimization.test.mjs"]'
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for (const path of JSON.parse(process.env.SOURCE_PATHS))
            console.log('FORMATTED_SOURCE ' + JSON.stringify({path,content:await readFile(path,'utf8')}));
          JS
          npm view @fontsource/noto-serif-sc@5.3.1 dist --json
