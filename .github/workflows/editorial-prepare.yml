name: Prepare editorial review sources
on:
  pull_request:
jobs:
  prepare:
    if: github.head_ref == 'feat/editorial-concept-fidelity'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write docs/design/EDITORIAL-RELEASE.md docs/design/EDITORIAL-SYSTEM.md scripts/web-assets.mjs cloud-web/test/image-performance.browser.mjs cloud-web/test/theme.browser.mjs
      - name: Export formatted sources
        env:
          SOURCE_PATHS: '["docs/design/EDITORIAL-RELEASE.md","docs/design/EDITORIAL-SYSTEM.md","scripts/web-assets.mjs","cloud-web/test/image-performance.browser.mjs","cloud-web/test/theme.browser.mjs"]'
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for (const path of JSON.parse(process.env.SOURCE_PATHS))
            console.log('FORMATTED_SOURCE ' + JSON.stringify({path,content:await readFile(path,'utf8')}));
          JS
