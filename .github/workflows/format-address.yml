name: Format article address patch

on:
  push:
    branches: [fix/edit-post-address]

concurrency:
  group: format-post-address
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format JavaScript, TypeScript, HTML, CSS and documentation
        run: npx prettier --write cloud-admin/src/models.ts cloud-admin/src/post-metadata.ts cloud-admin/src/post-addresses.ts cloud-admin/src/index.ts cloud-admin/src/publishing.ts cloud-admin/src/browser-publishing.ts cloud-web/src/index.ts cloud-admin/src/backup.ts cloud-admin/ui/index.html cloud-admin/ui/workflows.css cloud-admin/ui/post-address.js cloud-admin/ui/app.js cloud-admin/build-ui.mjs cloud-web/test/post-address.test.mjs cloud-web/test/post-address.browser.mjs scripts/ui-audit.mjs docs/DEPLOYMENT.md README.md docs/DEVELOPMENT.md cloud-admin/ui/studio.css
      - name: Format Rust
        run: |
          rustup component add rustfmt
          cargo fmt --all
      - name: Return formatted source
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFile} from 'node:fs/promises';
          const paths=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for (const path of paths) console.log('ADDRESS_FORMAT '+JSON.stringify({path,content:await readFile(path,'utf8')}));
          JS
