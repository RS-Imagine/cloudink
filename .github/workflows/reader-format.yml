name: Reader source formatting
on:
  push:
    branches: [perf/reader-loading-and-navigation]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write assets/reader-runtime.js cloud-web/test/reader-loading.browser.mjs cloud-web/test/reader-performance.browser.mjs cloud-web/test/editor.browser.mjs crates/blog-core/src/assets/reader.css
      - run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const path of ["assets/reader-runtime.js","cloud-web/test/reader-loading.browser.mjs","cloud-web/test/reader-performance.browser.mjs","cloud-web/test/editor.browser.mjs","crates/blog-core/src/assets/reader.css"])
            console.log('READER_FORMAT_FILE '+path+' '+(await readFile(path)).toString('base64'));
          NODE
