name: Reader source formatting
on:
  push:
    branches: [perf/reader-loading-and-navigation]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write assets/reader-runtime.js
      - run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          console.log('READER_FORMAT_FILE assets/reader-runtime.js '+(await readFile('assets/reader-runtime.js')).toString('base64'));
          NODE
