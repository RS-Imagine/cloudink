name: Reader source formatting
on:
  push:
    branches: [perf/reader-loading-and-navigation]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write README.md docs/DEVELOPMENT.md package.json cloud-admin/package.json cloud-admin/package-lock.json .github/workflows/checks.yml scripts/web-assets.mjs scripts/ui-audit.mjs assets/reader-runtime.js crates/blog-core/src/assets/reader.css cloud-admin/ui/preview.js cloud-web/src/index.ts cloud-web/src/reader.ts cloud-web/test/reader.test.mjs cloud-web/test/reader-loading.browser.mjs cloud-web/test/reader-performance.browser.mjs
      - run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const path of ["README.md","docs/DEVELOPMENT.md","package.json","cloud-admin/package.json","cloud-admin/package-lock.json",".github/workflows/checks.yml","scripts/web-assets.mjs","scripts/ui-audit.mjs","assets/reader-runtime.js","crates/blog-core/src/assets/reader.css","cloud-admin/ui/preview.js","cloud-web/src/index.ts","cloud-web/src/reader.ts","cloud-web/test/reader.test.mjs","cloud-web/test/reader-loading.browser.mjs","cloud-web/test/reader-performance.browser.mjs"])
            console.log('READER_FORMAT_FILE '+path+' '+(await readFile(path)).toString('base64'));
          NODE
