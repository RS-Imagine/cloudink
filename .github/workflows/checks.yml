name: Project checks

on:
  workflow_dispatch:
    inputs:
      visual_audit:
        description: Run the full three-browser visual audit
        type: boolean
        default: false
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud-admin/package-lock.json
      - name: Install project tools
        run: npm ci
      - name: Normalize reviewed files for this cleanup
        run: |
          npx prettier --write cloud-admin/src/backup.ts cloud-admin/src/index.ts cloud-admin/src/models.ts cloud-admin/ui/index.html cloud-admin/ui/style.css cloud-admin/ui/workflows.css README.md docs/DEVELOPMENT.md package.json scripts/ui-audit.mjs cloud-admin/build-ui.mjs cloud-web/test/ui-stability.browser.mjs
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          for (const path of ["cloud-admin/src/backup.ts","cloud-admin/src/index.ts","cloud-admin/src/models.ts","cloud-admin/ui/index.html","cloud-admin/ui/style.css","cloud-admin/ui/workflows.css","README.md","docs/DEVELOPMENT.md","package.json","scripts/ui-audit.mjs","cloud-admin/build-ui.mjs","cloud-web/test/ui-stability.browser.mjs"])
            console.log('FORMATTED_SOURCE ' + JSON.stringify({path, content: (await readFile(path)).toString('base64')}));
          JS
      - name: Check source formatting
        run: npm run format:check
      - name: Build the browser deployment
        run: npm run build
      - name: Report UI resource sizes
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {gzipSync} from 'node:zlib';
          for (const path of ['cloud-admin/ui/app.generated.js','cloud-admin/ui/home-illustration.generated.js','cloud-admin/ui/wasm/blog_wasm_bg.wasm'])
            console.log(JSON.stringify({asset:path,gzip:gzipSync(await readFile(path)).length}));
          JS
      - name: Generate binding types and check TypeScript
        run: npm run check
      - name: Bundle the Worker without deploying
        run: |
          npx wrangler deploy --dry-run --outdir cloud-web/dist
      - name: Run storage, authentication and publication tests
        run: |
          npm test
          cargo test --workspace --locked
      - name: Check touched Rust formatting and Clippy
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked
      - name: Install Chromium
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium
      - name: Verify onboarding and editor flows in Chromium
        run: |
          npm run test:web:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            cloud-web/dist/*.png
            cloud-web/dist/image-performance.json
          if-no-files-found: ignore

  ui-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud-admin/package-lock.json
      - name: Install project tools
        run: npm ci
      - name: Check shared UI source formatting
        run: npm run format:ui:check
      - name: Build isolated UI fixture
        run: npm run build
      - name: Bundle local Worker without deploying
        run: npx wrangler deploy --dry-run --outdir cloud-web/dist
      - name: Install three browser engines
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Chinese serif fonts for public review
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Prepare public-domain real photo fixture
        run: node cloud-web/test/image-photo-fixture.mjs
      - name: Prepare CC0 editorial landscape fixture
        run: node cloud-web/test/editorial-photo-fixture.mjs
      - name: Check production UI and capture screenshots
        run: npm run test:ui:audit
      - name: Save UI review, screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-design-review
          retention-days: 90
          path: build-work/ui-audit
          if-no-files-found: ignore
