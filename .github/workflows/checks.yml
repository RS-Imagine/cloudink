name: Project checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud-admin/package-lock.json
      - name: Install project tools
        run: npm ci
      - name: Check source formatting
        run: npm run format:check
      - name: Build the browser deployment
        run: npm run build
      - name: Report UI resource sizes
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {gzipSync} from 'node:zlib';
          for (const path of ['cloud-admin/ui/app.generated.js','cloud-admin/ui/home-illustration.generated.js','cloud-admin/ui/wasm/blog_wasm_bg.wasm'])
            console.log(JSON.stringify({asset:path,gzip:gzipSync(await readFile(path)).length}));
          JS
      - name: Generate binding types and check TypeScript
        run: npm run check
      - name: Bundle the Worker without deploying
        run: |
          npx wrangler deploy --dry-run --outdir cloud-web/dist
      - name: Run storage, authentication and publication tests
        run: |
          npm test
          cargo test --workspace --locked
      - name: Check touched Rust formatting and Clippy
        run: |
          rustup component add rustfmt clippy
          rustfmt --check --edition 2021 crates/blog-core/src/models.rs crates/blog-core/src/render.rs crates/blog-core/tests/home.rs
          cargo clippy --workspace --all-targets --locked
      - name: Install Chromium
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium
      - name: Verify onboarding and editor flows in Chromium
        run: |
          npm run test:web:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            cloud-web/dist/*.png
            cloud-web/dist/image-performance.json
          if-no-files-found: ignore

  ui-audit:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud-admin/package-lock.json
      - name: Install project tools
        run: npm ci
      - name: Fetch reviewed performance baseline
        run: git fetch --no-tags --depth=1 origin 6b97a08cf93ef0a1a545f045d0660e17174cb258
      - name: Check design source formatting
        run: npm run format:ui:check
      - name: Build isolated UI fixture
        run: npm run build
      - name: Bundle local Worker without deploying
        run: npx wrangler deploy --dry-run --outdir cloud-web/dist
      - name: Install three browser engines
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Chinese serif fonts for public review
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Prepare public-domain real photo fixture
        run: node cloud-web/test/image-photo-fixture.mjs
      - name: Capture production themes and approved design reference
        run: npm run test:ui:audit
      - name: Save UI review, screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-design-review
          retention-days: 90
          path: build-work/ui-audit
          if-no-files-found: ignore

  editorial-study:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated design tools
        run: |
          npm ci
          npm --prefix cloud-admin ci
      - name: Check editorial source formatting
        run: npx prettier --check prototypes/editorial scripts/editorial-study.mjs
      - name: Install browser engines
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Chinese serif fonts for review
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Verify editorial study
        run: node scripts/editorial-study.mjs
      - name: Save screenshots and portable study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-design-review
          retention-days: 90
          path: |
            build-work/editorial-review
            prototypes/editorial
            assets/design-tokens.css
          if-no-files-found: error
