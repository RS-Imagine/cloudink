name: Project checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud-admin/package-lock.json
      - name: Install project tools
        run: npm ci
      - name: Check source formatting
        run: npm run format:check
      - name: Build the browser deployment
        run: npm run build
      - name: Generate binding types and check TypeScript
        run: npm run check
      - name: Bundle the Worker without deploying
        run: |
          npx wrangler deploy --dry-run --outdir cloud-web/dist
      - name: Run storage, authentication and publication tests
        run: |
          npm test
          cargo test --workspace --locked
      - name: Install Chromium
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium
      - name: Verify onboarding and editor flows in Chromium
        run: |
          npm run test:web:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: cloud-web/dist/*.png
          if-no-files-found: ignore

  ui-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud-admin/package-lock.json
      - name: Install project tools
        run: npm ci
      - name: Prepare design formatting review
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import * as prettier from 'prettier';
          const paths = ["prototypes/ui-2.0/tokens.css","prototypes/ui-2.0/index.html","prototypes/ui-2.0/style.css","prototypes/ui-2.0/app.js","scripts/ui-audit.mjs","docs/design/UI-2.0-PLAN.md","docs/design/UI-2.0-SYSTEM.md","docs/design/UI-2.0-AUDIT.md","prototypes/ui-2.0/README.md"];
          for (const path of paths) {
            const options = await prettier.resolveConfig(path);
            const content = await prettier.format(await readFile(path, 'utf8'), { ...options, filepath: path });
            console.log('UI_FORMAT_SOURCE ' + JSON.stringify({ path, content }));
          }
          NODE
      - name: Build isolated UI fixture
        run: npm run build
      - name: Bundle local Worker without deploying
        run: npx wrangler deploy --dry-run --outdir cloud-web/dist
      - name: Install three browser engines
        working-directory: cloud-admin
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Capture baselines and verify UI study
        run: npm run test:ui:audit
      - name: Save UI review, screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-design-review
          path: build-work/ui-audit
          if-no-files-found: ignore
